name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  validate:
    name: Validate skills & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill manifests
        run: python3 scripts/validate-skills.py
      - name: Validate canonical audit schema
        run: python3 scripts/audit_schema.py tests/fixtures/sample_AUDIT.json
      - name: Install test deps
        run: python3 -m pip install --upgrade pip && python3 -m pip install pytest
      - name: Run tests
        run: pytest -q
